# Queries for comparing search_policies variants (eval/retrieval.py).
# `expected` lists the section headings that count as a hit.
# Empty list = off-topic, no match expected.
# `mismatch = true` marks questions worded differently than the policy text.

[[query]]
text = "What time do you open on Saturday?"
expected = ["When are you open?"]

[[query]]
text = "When do you close?"
expected = ["When are you open?"]
mismatch = true

[[query]]
text = "Are you open on Christmas?"
expected = ["When are you open?"]
mismatch = true

[[query]]
text = "How much is an e-bike for a whole day?"
expected = ["Bike rental"]

[[query]]
text = "How much does a child seat cost?"
expected = ["Add-ons"]

[[query]]
text = "Can my 14-year-old rent an e-bike?"
expected = ["Are there age limits?"]

[[query]]
text = "I want to cancel my booking, how much will I get back?"
expected = ["Cancelling a booking"]

[[query]]
text = "Do I get the booking fee back?"
expected = ["Cancelling a booking", "Booking fee"]

[[query]]
text = "When will the money be back on my card?"
expected = ["How the money comes back"]
mismatch = true

[[query]]
text = "Can I change the date of my booking?"
expected = ["Changing a booking"]

[[query]]
text = "There is a storm forecast for my rental day, what now?"
expected = ["Bad weather"]

[[query]]
text = "What is your phone number?"
expected = ["Contact the staff"]

[[query]]
text = "Where is the shop?"
expected = ["Where are you?"]
mismatch = true

[[query]]
text = "What documents do I need?"
