[[query]]
text = "Can I bring my dog?"
expected = ["Can I take my dog?"]
mismatch = true

[[query]]
text = "Can I take the bike to Germany?"
expected = ["Can I take the bike on a train or outside the city?"]
mismatch = true

[[query]]
text = "I got a flat tyre, what should I do?"
expected = ["What if the bike breaks or I have an accident?"]
mismatch = true

[[query]]
text = "My bike was stolen"
expected = ["What if the bike is stolen or lost?"]

[[query]]
text = "What happens if I return the bike late?"
expected = ["Late return"]

[[query]]
text = "How much is the deposit for an e-bike?"
