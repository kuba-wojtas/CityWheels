[project]
name = "citywheels"
version = "0.1.0"
description = "Command-line help desk agent for the CityWheels bike rental shop"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.42.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
